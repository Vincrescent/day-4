<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Medieval 3D Chess</title>
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>

<!-- Loading screen -->
<div id="loader">
  <div class="loader-inner">
    <h2>Medieval 3D Chess</h2>
    <p>Summoning the ancient chamber…</p>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <span id="loaderStatus">Initializing…</span>
  </div>
</div>

<!-- Start Menu Overlay -->
<div id="startMenuOverlay" class="hidden">
  <div class="start-panel panel">
    <h2 class="start-title">New Game</h2>
    <div class="start-form">
      <div class="form-row">
        <label for="gameMode">Mode</label>
        <select id="gameMode">
          <option value="ai" selected>vs Computer</option>
          <option value="aivai">Computer vs Computer</option>
          <option value="local">2 Players</option>
        </select>
      </div>
      <div class="form-row diff-row">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="form-row">
        <label for="timeMode">Time</label>
        <select id="timeMode">
          <option value="unlimited" selected>Unlimited</option>
          <option value="blitz">Blitz (5 min)</option>
          <option value="rapid">Rapid (10+5)</option>
        </select>
      </div>
      <button class="start-btn play-btn">Play</button>
    </div>
    <div class="shortcut-hints">
      <span>U — Undo</span>
      <span>F — Flip Board</span>
      <span>R — Reset View</span>
      <span>Esc — Deselect</span>
    </div>
  </div>
</div>

<!-- Confirm Dialog Overlay -->
<div id="confirmOverlay" class="hidden">
  <div class="confirm-panel panel">
    <h3 class="confirm-title">Confirm</h3>
    <p class="confirm-msg">Are you sure?</p>
    <div class="confirm-btns">
      <button class="confirm-yes play-btn">Yes</button>
      <button class="confirm-no play-btn">No</button>
    </div>
  </div>
</div>

<!-- Promotion selection overlay -->
<div id="promoOverlay">
  <div class="promo-panel">
    <div class="promo-title">Promote Pawn</div>
    <div id="promoChoices" class="promo-choices"></div>
  </div>
</div>

<!-- Game over overlay -->
<div id="gameOverOverlay">
  <div class="gameover-panel">
    <h1 id="gameOverTitle">Checkmate</h1>
    <p id="gameOverSub">White wins!</p>
    <button id="btnGameOverNew" class="play-btn">Play Again</button>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<!-- HUD overlay -->
<div id="ui" class="hidden">

  <!-- Chess Clocks -->
  <div class="clock-bar">
    <div class="clock-side clock-black">
      <span class="clock-label">Black</span>
      <span class="clock-time" id="clockBlack">--:--</span>
    </div>
    <div class="clock-side clock-white">
      <span class="clock-label">White</span>
      <span class="clock-time" id="clockWhite">--:--</span>
    </div>
  </div>

  <!-- Left panel — turn + status -->
  <div class="panel panel-left">
    <div class="turn-indicator" id="turnIndicator">White to move</div>
    <div id="checkBadge" class="state-badge danger" style="display:none">Check!</div>
    <div id="checkmateBadge" class="state-badge danger" style="display:none">Checkmate</div>
    <div id="thinkingBadge" class="state-badge thinking" style="display:none">Thinking…</div>
  </div>

  <!-- Right panel — captured pieces -->
  <div class="panel panel-right">
    <div class="captured">
      <div class="label">White captures</div>
      <div class="pieces" id="capturedWhitePieces"></div>
    </div>
    <div class="captured">
      <div class="label">Black captures</div>
      <div class="pieces" id="capturedBlackPieces"></div>
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="controls">
    <button id="btnNew">New Game</button>
    <button id="btnUndo">Undo</button>
    <button id="btnFlip">Flip ↺</button>
    <button id="btnView">Reset View</button>
    <button id="btnDraw" class="btn-secondary">Draw</button>
    <button id="btnResign" class="btn-danger">Resign</button>
    <button id="btnPause" class="btn-secondary" style="display:none">⏸ Pause</button>
    <button id="btnMute" class="btn-icon" title="Toggle Sound">🔊</button>
    <button id="btnFullscreen" class="btn-icon" title="Fullscreen">⛶</button>
  </div>

  <!-- Move history -->
  <div class="history" id="moveHistory"></div>

  <!-- FPS Counter -->
  <div class="fps-counter" id="fpsCounter">0 FPS</div>
</div>

<script type="module" src="src/index.js"></script>
</body>
</html>
